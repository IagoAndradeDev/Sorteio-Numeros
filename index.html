<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="box">
            <div class="title">
                <h1>Sorteio</h1>
                <h2>Sorteio de número entre os valores!</h2>
            </div>
            <div class="inputs">
                <div class="min">
                    <p>Minimo</p>
                    <input type="number" placeholder="">
                </div>
                <div class="max">
                    <p>Máximo</p>
                    <input type="number" placeholder="">
                </div>
            </div>
            <div class="buttons">
                <button onclick="gerarValor()" class="sortear">Sortear</button>
            </div>
            <div class="resultado">
                <h1 style="display: none;">Seu resultado:</h1>
                <p></p>
            </div>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
